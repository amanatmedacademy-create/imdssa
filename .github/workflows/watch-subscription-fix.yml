name: Watch Subscription Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch-subscription-fix.yml'
permissions:
  contents: write
  actions: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Watch fix workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID=''
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list --repo "$REPO" --workflow fix-subscription-null-plan.yml --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status || true
          CONCLUSION="$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion --jq '.conclusion')"
          mkdir -p docs/internal
          {
            echo "subscription_fix_run_id=$RUN_ID"
            echo "subscription_fix_conclusion=$CONCLUSION"
            gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '.jobs[] | [.name,.conclusion] | @tsv'
          } > docs/internal/subscription-fix-status.txt
      - name: Publish result marker
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add docs/internal/subscription-fix-status.txt
          git commit -m 'record subscription fix workflow result' || true
          git pull --rebase origin main
          git push origin HEAD:main
