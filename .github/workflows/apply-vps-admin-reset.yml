name: Apply VPS Admin Reset

on:
  push:
    branches:
      - agent/vps-control-plane
    paths:
      - .github/workflows/apply-vps-admin-reset.yml

permissions:
  contents: read

jobs:
  reset-admin:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      RESET_CIPHERTEXT: 
    steps:
      - name: Validate VPS secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Apply encrypted credential reset
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30)
          printf '%s' "$RESET_CIPHERTEXT" | base64 -d > /tmp/imdssa-reset.bin
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imdssa-reset.bin "$VPS_USER@$VPS_HOST:/tmp/imdssa-reset.bin"
          rm -f /tmp/imdssa-reset.bin
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            sudo openssl pkeyutl -decrypt \
              -inkey /root/imdssa-admin-reset/private.pem \
              -in /tmp/imdssa-reset.bin \
              -out /root/imdssa-admin-reset/reset.json \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -pkeyopt rsa_mgf1_md:sha256
            sudo chmod 0600 /root/imdssa-admin-reset/reset.json
            sudo tee /root/imdssa-admin-reset/apply.mjs >/dev/null <<"NODE"
import fs from "node:fs";
import { createRequire } from "node:module";
import { randomBytes, scryptSync } from "node:crypto";
const require = createRequire("/opt/imds-super-admin/api/package.json");
const pg = require("pg");
const data = JSON.parse(fs.readFileSync("/root/imdssa-admin-reset/reset.json", "utf8"));
const email = String(data.email || "").trim().toLowerCase();
const password = String(data.password || "");
if (!email.includes("@")) throw new Error("invalid admin email");
if (password.length < 10) throw new Error("temporary password must be at least 10 characters");
const envText = fs.readFileSync("/etc/imds-super-admin/postgres.env", "utf8");
const env = Object.fromEntries(envText.split(/\n+/).filter(Boolean).map((line) => { const i = line.indexOf("="); return [line.slice(0, i), line.slice(i + 1)]; }));
const salt = randomBytes(16).toString("hex");
const passwordHash = `scrypt:${salt}:${scryptSync(password, salt, 64).toString("hex")}`;
const pool = new pg.Pool({ connectionString: env.DATABASE_URL });
const result = await pool.query(`update app.platform_users
  set email=$1,password_hash=$2,full_name='IMDS Platform Owner',global_role='platform_owner',is_active=true,updated_at=now()
  where id=(select id from app.platform_users where global_role='platform_owner' order by created_at asc limit 1)
  returning id,email,global_role`, [email, passwordHash]);
if (!result.rowCount) throw new Error("platform_owner not found");
await pool.query("delete from app.auth_sessions");
console.log(`updated platform owner ${result.rows[0].email}; sessions revoked`);
await pool.end();
NODE
            sudo chmod 0700 /root/imdssa-admin-reset/apply.mjs
            sudo node /root/imdssa-admin-reset/apply.mjs
            sudo rm -f /root/imdssa-admin-reset/reset.json /root/imdssa-admin-reset/apply.mjs /root/imdssa-admin-reset/private.pem /root/imdssa-admin-reset/public.pem /tmp/imdssa-reset.bin
            sudo systemctl restart imds-super-admin-api.service
            curl -fsS http://127.0.0.1:8788/healthz >/dev/null
          '

      - name: Verify public service
        shell: bash
        run: curl -fsS --max-time 20 "http://$VPS_HOST:8080/healthz" >/dev/null
