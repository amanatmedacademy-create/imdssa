name: Apply VPS Admin Reset

on:
  push:
    branches:
      - agent/vps-control-plane
    paths:
      - .github/workflows/apply-vps-admin-reset.yml

permissions:
  contents: read

jobs:
  reset-admin:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      RESET_CIPHERTEXT: 
    steps:
      - name: Validate VPS secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Apply encrypted credential reset
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30)
          printf '%s' "$RESET_CIPHERTEXT" | base64 -d > /tmp/imdssa-reset.bin
          sshpass -e scp "${SSH_ARGS[@]}" /tmp/imdssa-reset.bin "$VPS_USER@$VPS_HOST:/tmp/imdssa-reset.bin"
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/apply-admin-reset.sh "$VPS_USER@$VPS_HOST:/tmp/apply-admin-reset.sh"
          rm -f /tmp/imdssa-reset.bin
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo install -m 0700 /tmp/apply-admin-reset.sh /root/imdssa-admin-reset/apply-admin-reset.sh && sudo /root/imdssa-admin-reset/apply-admin-reset.sh && sudo rm -f /root/imdssa-admin-reset/apply-admin-reset.sh /tmp/apply-admin-reset.sh'

      - name: Verify public service
        shell: bash
        run: curl -fsS --max-time 20 "http://$VPS_HOST:8080/healthz" >/dev/null
