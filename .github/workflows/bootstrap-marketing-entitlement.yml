name: Bootstrap Marketing Entitlement

on:
  push:
    branches: ['agent/vps-control-plane']
    paths: ['.github/workflows/bootstrap-marketing-entitlement.yml']

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure Marketing in Super Admin
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          API=http://127.0.0.1:8788
          TENANT_ID=4cd22020-6f1d-4afb-9266-b01c96e4a927
          ORG_NAME='Amanat Med Academy'

          command -v jq >/dev/null 2>&1 || { apt-get update >/dev/null && apt-get install -y jq >/dev/null; }

          ADMIN_ID="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select id from app.platform_users where is_active=true and global_role in ('platform_owner','platform_admin') order by case global_role when 'platform_owner' then 0 else 1 end, created_at limit 1")"
          test -n "$ADMIN_ID" || { echo 'No active platform owner/admin found'; exit 31; }
          SESSION_TOKEN="$(openssl rand -hex 32)"
          SESSION_HASH="$(printf '%s' "$SESSION_TOKEN" | sha256sum | awk '{print $1}')"
          sudo -u postgres psql --dbname=imdssa --set=ON_ERROR_STOP=1 --command="insert into app.auth_sessions(user_id,token_hash,expires_at) values ('$ADMIN_ID'::uuid,'$SESSION_HASH',now()+interval '10 minutes')" >/dev/null
          cleanup() {
            sudo -u postgres psql --dbname=imdssa --command="delete from app.auth_sessions where token_hash='$SESSION_HASH'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          COOKIE="Cookie: imdssa_session=$SESSION_TOKEN"
          curl -fsS -H "$COOKIE" "$API/api/auth/me" | jq -e '.user.role == "platform_owner" or .user.role == "platform_admin"' >/dev/null
          echo 'SUPER_ADMIN_TEMP_SESSION=ok'

          orgs="$(curl -fsS -H "$COOKIE" "$API/api/v1/organizations")"
          org_id="$(printf '%s' "$orgs" | jq -r --arg name "$ORG_NAME" '.items[] | select((.name|ascii_downcase)==($name|ascii_downcase)) | .id' | head -1)"
          if [ -z "$org_id" ]; then
            org_payload="$(jq -nc --arg name "$ORG_NAME" --arg externalKey "$TENANT_ID" '{name:$name,externalKey:$externalKey,status:"active"}')"
            org_id="$(curl -fsS -H "$COOKIE" -H 'content-type: application/json' -X POST "$API/api/v1/organizations" --data-binary "$org_payload" | jq -r '.id')"
            echo 'SUPER_ADMIN_ORGANIZATION=created'
          else
            echo 'SUPER_ADMIN_ORGANIZATION=existing'
          fi
          test -n "$org_id" && test "$org_id" != null

          products="$(curl -fsS -H "$COOKIE" "$API/api/v1/products")"
          product_id="$(printf '%s' "$products" | jq -r '.items[] | select(.code=="imds-marketing") | .id' | head -1)"
          test -n "$product_id" && test "$product_id" != null

          product_payload="$(jq -nc --arg organizationId "$org_id" --arg productId "$product_id" --arg remoteTenantId "$TENANT_ID" '{organizationId:$organizationId,productId:$productId,status:"active",config:{remoteTenantId:$remoteTenantId}}')"
          curl -fsS -H "$COOKIE" -H 'content-type: application/json' -X POST "$API/api/v1/organization-products" --data-binary "$product_payload" >/dev/null
          echo 'MARKETING_PRODUCT_ENTITLEMENT=active'

          modules="$(curl -fsS -H "$COOKIE" "$API/api/v1/modules")"
          module_count=0
          while IFS='|' read -r module_id module_code; do
            [ -n "$module_id" ] || continue
            installation_payload="$(jq -nc --arg organizationId "$org_id" --arg moduleId "$module_id" --arg hostProductId "$product_id" '{organizationId:$organizationId,moduleId:$moduleId,hostProductId:$hostProductId,status:"active",config:{}}')"
            curl -fsS -H "$COOKIE" -H 'content-type: application/json' -X POST "$API/api/v1/installations" --data-binary "$installation_payload" >/dev/null
            module_count=$((module_count + 1))
            echo "MODULE_ENABLED=$module_code"
          done < <(printf '%s' "$modules" | jq -r '.items[] | select(.owner_product_code=="imds-marketing" and .status=="published") | [.id,.code] | @tsv' | tr '\t' '|')
          test "$module_count" -gt 0
          echo "MARKETING_MODULES_ENABLED=$module_count"

          systemctl start imdssa-reconcile.service || true
          desired=''; actual=''; sync=''; remote=''
          for attempt in $(seq 1 20); do
            state="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --field-separator='|' --command="select b.desired_revision,b.actual_revision,b.sync_status,coalesce(b.remote_tenant_id,''),coalesce(b.last_error,'') from app.product_tenant_bindings b where b.organization_id='$org_id'::uuid and b.product_id='$product_id'::uuid")"
            desired="$(printf '%s' "$state" | cut -d'|' -f1)"
            actual="$(printf '%s' "$state" | cut -d'|' -f2)"
            sync="$(printf '%s' "$state" | cut -d'|' -f3)"
            remote="$(printf '%s' "$state" | cut -d'|' -f4)"
            if [ -n "$desired" ] && [ "$desired" = "$actual" ] && [ "$sync" = synced ] && [ "$remote" = "$TENANT_ID" ]; then
              echo "CONTROL_BINDING_REVISION=$desired"
              echo 'CONTROL_BINDING_SYNC=synced'
              break
            fi
            sleep 2
            systemctl start imdssa-reconcile.service || true
          done
          test -n "$desired" && test "$desired" = "$actual" && test "$sync" = synced && test "$remote" = "$TENANT_ID"

          source /etc/imds-platform-control.env
          marketing_state="$(curl -fsS -H "Authorization: Bearer $IMDS_PLATFORM_CONTROL_TOKEN" http://127.0.0.1:8787/internal/platform/state)"
          printf '%s' "$marketing_state" | jq -e --arg tenant "$TENANT_ID" '.tenants[$tenant].productEnabled == true' >/dev/null
          enabled_count="$(printf '%s' "$marketing_state" | jq -r --arg tenant "$TENANT_ID" '[.tenants[$tenant].modules[] | select(. == true)] | length')"
          test "$enabled_count" -eq "$module_count"
          echo "MARKETING_ACTUAL_MODULES_ENABLED=$enabled_count"
          echo 'MARKETING_PLATFORM_STATE=verified'
          REMOTE
