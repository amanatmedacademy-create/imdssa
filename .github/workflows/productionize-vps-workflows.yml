name: Productionize VPS workflows

on:
  push:
    branches: [agent/vps-production-cleanup]
    paths: [.github/workflows/productionize-vps-workflows.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vps-production-cleanup
      - name: Update production triggers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          deploy = Path('.github/workflows/deploy-vps-control-plane.yml')
          text = deploy.read_text()
          old = "branches: ['agent/vps-control-plane']"
          new = "branches: [main, 'agent/vps-control-plane']"
          if old not in text:
              raise SystemExit('deploy trigger marker not found')
          deploy.write_text(text.replace(old, new, 1))

          e2e = Path('.github/workflows/control-plane-e2e.yml')
          text = e2e.read_text()
          old = "on:\n  workflow_dispatch:\n  push:\n    branches: ['agent/control-plane-e2e-protocol']\n    paths: ['.github/workflows/control-plane-e2e.yml']\n"
          new = "on:\n  workflow_dispatch:\n"
          if old not in text:
              raise SystemExit('E2E trigger marker not found')
          e2e.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/deploy-vps-control-plane.yml .github/workflows/control-plane-e2e.yml
          git diff --cached --check
          git commit -m 'productionize VPS workflow triggers'
          git push origin HEAD:agent/vps-production-cleanup
