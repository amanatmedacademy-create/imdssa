name: Bootstrap VPS PostgreSQL

on:
  workflow_dispatch:
  push:
    branches: [agent/vps-control-plane]
    paths:
      - deploy/vps/bootstrap-postgres.sh
      - deploy/vps/migrations/**
      - .github/workflows/bootstrap-vps-postgres.yml

permissions:
  contents: read

concurrency:
  group: imdssa-vps-postgres
  cancel-in-progress: false

jobs:
  bootstrap-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload bootstrap files
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'mkdir -p /tmp/imdssa-vps/migrations'
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/bootstrap-postgres.sh "$VPS_USER@$VPS_HOST:/tmp/imdssa-vps/bootstrap-postgres.sh"
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/migrations/001_control_plane.sql "$VPS_USER@$VPS_HOST:/tmp/imdssa-vps/migrations/001_control_plane.sql"
      - name: Install PostgreSQL and schema
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            sudo mkdir -p /opt/imds-super-admin/migrations
            sudo install -m 0750 /tmp/imdssa-vps/bootstrap-postgres.sh /opt/imds-super-admin/bootstrap-postgres.sh
            sudo install -m 0640 /tmp/imdssa-vps/migrations/001_control_plane.sql /opt/imds-super-admin/migrations/001_control_plane.sql
            sudo /opt/imds-super-admin/bootstrap-postgres.sh
          '
      - name: Verify PostgreSQL
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            systemctl is-active --quiet postgresql
            sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select count(*) from information_schema.tables where table_schema = '\''app'\'';" | grep -Eq "^[1-9][0-9]*$"
            ! ss -lnt | grep -Eq "(0\.0\.0\.0:5432|\[::\]:5432)"
            echo "PostgreSQL bootstrap verified"
          '
