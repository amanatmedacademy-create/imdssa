name: Verify Telegram Configuration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS secrets
        run: 'test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_PASSWORD"'
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Verify Telegram configuration without exposing secrets
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          ENV_FILE=/etc/imds-super-admin/telegram.env
          if [ ! -f "$ENV_FILE" ]; then
            echo 'telegram_config=missing_file'
            exit 2
          fi
          set -a
          source "$ENV_FILE"
          set +a
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo 'telegram_config=missing_values'
            exit 3
          fi
          if ! curl -fsS --max-time 10 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | grep -q '"ok":true'; then
            echo 'telegram_config=invalid_bot_token'
            exit 4
          fi
          echo 'telegram_config=configured'
          REMOTE
