name: Fix Subscription Plan Narrowing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-subscription-null-plan.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply safe narrowing
        run: node scripts/fix-subscription-plan-narrowing.mjs
      - name: Validate
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint --workspace @imds/vps-api
          npm run build --workspace @imds/vps-api
          VITE_RUNTIME=vps VITE_APP_ENV=production VITE_APP_VERSION=0.8.0 IMDS_STRICT_ENV=true npm run build
          git diff --check
      - name: Commit validated fix
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add apps/vps-api/src/subscriptions.ts
          git rm .github/workflows/fix-subscription-null-plan.yml scripts/fix-subscription-plan-narrowing.mjs
          git commit -m 'fix subscription plan narrowing'
          git pull --rebase origin main
          git push origin HEAD:main
