name: Apply Tenant RBAC PR V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/tenant-rbac-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tenant-rbac-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration
        run: python3 scripts/apply-tenant-rbac.py
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint --workspace @imds/vps-api
          npm run build --workspace @imds/vps-api
          npm run lint
      - name: Commit
        run: |
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add apps/vps-api/src/index.ts deploy/vps/deploy-control-plane.sh src/vps/VpsApp.tsx
          git diff --cached --check
          git commit -m 'enforce tenant-scoped control plane access'
          git push origin HEAD:agent/tenant-rbac-isolation
