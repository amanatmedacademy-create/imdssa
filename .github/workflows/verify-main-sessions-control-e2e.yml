name: Verify Main Sessions and Control Plane E2E

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-main-sessions-control-e2e.yml']

permissions:
  contents: write

concurrency:
  group: verify-main-sessions-control-e2e
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current main
        env:
          VITE_RUNTIME: vps
          VITE_APP_ENV: production
          VITE_APP_VERSION: 0.8.0
          IMDS_STRICT_ENV: 'true'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint --workspace @imds/vps-api
          npm run build --workspace @imds/vps-api
          npm run lint
          npm run build
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Verify sessions and reversible platform enforcement
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { apt-get update >/dev/null && apt-get install -y jq >/dev/null; }
          SA_API=http://127.0.0.1:8788
          M_API=http://127.0.0.1:8787
          ORG_NAME='Amanat Med Academy'
          MODULE_CODE='marketing.analytics'

          systemctl is-active --quiet imds-super-admin-api.service
          systemctl is-active --quiet imdssa-reconcile.timer
          systemctl is-active --quiet imdssa-product-monitor.timer
          test -f /opt/imds-super-admin/api/dist/sessionRoutes.js
          grep -q '/api/auth/sessions' /opt/imds-super-admin/api/dist/sessionRoutes.js
          curl -fsS "$SA_API/healthz" >/dev/null

          ADMIN_ID="$(sudo -u postgres psql -d imdssa -At -c "select id from app.platform_users where is_active=true and global_role in ('platform_owner','platform_admin') order by case global_role when 'platform_owner' then 0 else 1 end,created_at limit 1")"
          test -n "$ADMIN_ID"
          T1="$(openssl rand -hex 32)"; H1="$(printf '%s' "$T1" | sha256sum | awk '{print $1}')"
          T2="$(openssl rand -hex 32)"; H2="$(printf '%s' "$T2" | sha256sum | awk '{print $1}')"
          S2="$(sudo -u postgres psql -d imdssa -At -c "insert into app.auth_sessions(user_id,token_hash,expires_at,source_ip,user_agent) values('$ADMIN_ID'::uuid,'$H2',now()+interval '10 minutes','127.0.0.1','IMDS E2E secondary') returning id")"
          sudo -u postgres psql -d imdssa -c "insert into app.auth_sessions(user_id,token_hash,expires_at,source_ip,user_agent) values('$ADMIN_ID'::uuid,'$H1',now()+interval '10 minutes','127.0.0.1','IMDS E2E current')" >/dev/null
          SA_COOKIE="Cookie: imdssa_session=$T1"

          cleanup_auth() {
            sudo -u postgres psql -d imdssa -c "delete from app.auth_sessions where token_hash in ('$H1','$H2')" >/dev/null 2>&1 || true
          }
          trap cleanup_auth EXIT

          sessions="$(curl -fsS -H "$SA_COOKIE" "$SA_API/api/auth/sessions")"
          printf '%s' "$sessions" | jq -e --arg id "$S2" '.items|map(select(.id==$id))|length==1' >/dev/null
          printf '%s' "$sessions" | jq -e '.items|map(select(.is_current==true))|length>=1' >/dev/null
          curl -fsS -H "$SA_COOKIE" -X DELETE "$SA_API/api/auth/sessions/$S2" | jq -e '.revoked==true' >/dev/null
          sudo -u postgres psql -d imdssa -At -c "select count(*) from app.auth_sessions where id='$S2'::uuid" | grep -q '^0$'
          echo 'SESSION_MANAGEMENT=success'

          installations="$(curl -fsS -H "$SA_COOKIE" "$SA_API/api/v1/installations")"
          installation_id="$(printf '%s' "$installations" | jq -r --arg c "$MODULE_CODE" --arg o "$ORG_NAME" '.items[]|select(.module_code==$c and .organization_name==$o)|.id' | head -1)"
          organization_id="$(printf '%s' "$installations" | jq -r --arg id "$installation_id" '.items[]|select(.id==$id)|.organization_id' | head -1)"
          original_status="$(printf '%s' "$installations" | jq -r --arg id "$installation_id" '.items[]|select(.id==$id)|.status' | head -1)"
          [[ "$installation_id" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$organization_id" =~ ^[0-9a-f-]{36}$ ]]
          test "$original_status" = active -o "$original_status" = suspended

          source /etc/imds-platform-control.env
          state="$(curl -fsS -H "Authorization: Bearer $IMDS_PLATFORM_CONTROL_TOKEN" "$M_API/internal/platform/state")"
          tenant_id="$(printf '%s' "$state" | jq -r --arg org "$organization_id" '.tenants|to_entries[]|select(.value.organizationId==$org)|.key' | head -1)"
          [[ "$tenant_id" =~ ^[0-9a-f-]{36}$ ]]

          M_USER="$(docker exec imds-postgres psql -U imds_owner -d imds_marketing -At -c "select id from public.imds_auth_users where lower(email)='admin@imds.kz' and status='active' limit 1")"
          test -n "$M_USER"
          MT="$(openssl rand -hex 48)"; MH="$(printf '%s' "$MT" | sha256sum | awk '{print $1}')"
          docker exec imds-postgres psql -U imds_owner -d imds_marketing -c "insert into public.imds_auth_sessions(user_id,token_hash,remember_me,expires_at) values('$M_USER'::uuid,'$MH',false,now()+interval '10 minutes')" >/dev/null

          restore_all() {
            current="$(curl -fsS -H "$SA_COOKIE" "$SA_API/api/v1/installations" 2>/dev/null | jq -r --arg id "$installation_id" '.items[]|select(.id==$id)|.status' | head -1 || true)"
            if [ "$current" != "$original_status" ]; then
              curl -fsS -H "$SA_COOKIE" -H 'content-type: application/json' -X PATCH "$SA_API/api/v1/installations/$installation_id" --data "{\"status\":\"$original_status\"}" >/dev/null || true
              for _ in $(seq 1 25); do systemctl start imdssa-reconcile.service >/dev/null 2>&1 || true; sleep 1; done
            fi
            docker exec imds-postgres psql -U imds_owner -d imds_marketing -c "delete from public.imds_auth_sessions where token_hash='$MH'" >/dev/null 2>&1 || true
            cleanup_auth
          }
          trap restore_all EXIT

          revision() {
            curl -fsS -H "$SA_COOKIE" "$SA_API/api/v1/organization-products" | jq -r --arg org "$organization_id" '.items[]|select(.organization_id==$org and .product_code=="imds-marketing")|.desired_revision'
          }

          assert_state() {
            expected="$1"; start="$2"; require_403="$3"
            for attempt in $(seq 1 30); do
              systemctl start imdssa-reconcile.service >/dev/null 2>&1 || true
              sleep 1
              inst="$(curl -fsS -H "$SA_COOKIE" "$SA_API/api/v1/installations")"
              actual="$(printf '%s' "$inst" | jq -r --arg id "$installation_id" '.items[]|select(.id==$id)|.actual_enabled')"
              sync="$(printf '%s' "$inst" | jq -r --arg id "$installation_id" '.items[]|select(.id==$id)|.sync_status')"
              applied="$(printf '%s' "$inst" | jq -r --arg id "$installation_id" '.items[]|select(.id==$id)|.last_applied_revision')"
              bindings="$(curl -fsS -H "$SA_COOKIE" "$SA_API/api/v1/organization-products")"
              desired="$(printf '%s' "$bindings" | jq -r --arg org "$organization_id" '.items[]|select(.organization_id==$org and .product_code=="imds-marketing")|.desired_revision')"
              bactual="$(printf '%s' "$bindings" | jq -r --arg org "$organization_id" '.items[]|select(.organization_id==$org and .product_code=="imds-marketing")|.actual_revision')"
              bsync="$(printf '%s' "$bindings" | jq -r --arg org "$organization_id" '.items[]|select(.organization_id==$org and .product_code=="imds-marketing")|.sync_status')"
              remote="$(curl -fsS -H "Authorization: Bearer $IMDS_PLATFORM_CONTROL_TOKEN" "$M_API/internal/platform/state")"
              renabled="$(printf '%s' "$remote" | jq -r --arg t "$tenant_id" --arg c "$MODULE_CODE" '.tenants[$t].modules[$c]')"
              rrev="$(printf '%s' "$remote" | jq -r --arg t "$tenant_id" '.tenants[$t].revision')"
              browser="$(curl -fsS -H "Authorization: Bearer $MT" -H "x-imds-company-id: $tenant_id" "$M_API/api/platform/entitlements")"
              benabled="$(printf '%s' "$browser" | jq -r --arg c "$MODULE_CODE" '.modules[$c]')"
              brev="$(printf '%s' "$browser" | jq -r '.revision')"
              command="$(sudo -u postgres psql -d imdssa -At -c "select c.status from app.control_commands c join app.products p on p.id=c.product_id where c.organization_id='$organization_id'::uuid and p.code='imds-marketing' and c.desired_revision=$desired::bigint order by c.created_at desc limit 1" | xargs)"
              if [ "$actual" = "$expected" ] && [ "$sync" = synced ] && [ "$applied" = "$desired" ] && [ "$bactual" = "$desired" ] && [ "$bsync" = synced ] && [ "$renabled" = "$expected" ] && [ "$rrev" = "$desired" ] && [ "$benabled" = "$expected" ] && [ "$brev" = "$desired" ] && [ "$command" = succeeded ] && [ "$desired" -gt "$start" ]; then
                if [ "$require_403" = yes ]; then
                  code="$(curl -sS -o /tmp/analytics-gate.json -w '%{http_code}' -H "Authorization: Bearer $MT" -H "x-imds-company-id: $tenant_id" "$M_API/api/analytics")"
                  test "$code" = 403
                  jq -e --arg c "$MODULE_CODE" '.error=="MODULE_DISABLED_BY_PLATFORM" and .module==$c' /tmp/analytics-gate.json >/dev/null
                  echo 'MARKETING_DIRECT_API_403=success'
                fi
                echo "E2E_SYNCED expected=$expected revision=$desired attempts=$attempt"
                return 0
              fi
            done
            return 1
          }

          before="$(revision)"
          test_status=suspended; expected=false; gate=yes
          if [ "$original_status" = suspended ]; then test_status=active; expected=true; gate=no; fi
          echo "E2E_BEGIN org=$ORG_NAME module=$MODULE_CODE original=$original_status test=$test_status revision=$before"
          curl -fsS -H "$SA_COOKIE" -H 'content-type: application/json' -X PATCH "$SA_API/api/v1/installations/$installation_id" --data "{\"status\":\"$test_status\"}" >/dev/null
          assert_state "$expected" "$before" "$gate"

          mid="$(revision)"
          curl -fsS -H "$SA_COOKIE" -H 'content-type: application/json' -X PATCH "$SA_API/api/v1/installations/$installation_id" --data "{\"status\":\"$original_status\"}" >/dev/null
          original_expected=true; [ "$original_status" = suspended ] && original_expected=false
          assert_state "$original_expected" "$mid" no
          echo 'CONTROL_PLANE_E2E=success'
          echo "ORIGINAL_STATUS_RESTORED=$original_status"
          REMOTE
      - name: Record successful verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git pull --rebase origin main
          mkdir -p docs/internal
          printf 'sessions_and_control_plane_e2e=passed\nverified_from=%s\nverified_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > docs/internal/sessions-control-e2e.ok
          git add docs/internal/sessions-control-e2e.ok
          git commit -m 'record successful sessions and control plane E2E'
          git push origin HEAD:main
