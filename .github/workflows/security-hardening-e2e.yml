name: Security Hardening E2E
on:
  push:
    branches: ['agent/vps-security-hardening']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS secrets
        run: 'test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_PASSWORD"'
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Wait for matching feature release
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          for _ in $(seq 1 90); do
            deployed="$(sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "basename \"\$(readlink -f /var/www/imds-super-admin/current)\"" 2>/dev/null || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "release=$deployed"
              exit 0
            fi
            sleep 5
          done
          echo "Feature release $GITHUB_SHA was not deployed in time" >&2
          exit 1
      - name: Verify lockout, RBAC, password rotation and audit
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          API=http://127.0.0.1:8788
          TEST_ID="$(openssl rand -hex 8)"
          EMAIL="security-e2e-${TEST_ID}@invalid.imds"
          PASSWORD_ONE="Aa1!$(openssl rand -hex 12)"
          PASSWORD_TWO="Bb2@$(openssl rand -hex 12)"
          ACCOUNT_IP=198.51.100.10
          THROTTLE_IP=198.51.100.20
          LOGIN_IP=198.51.100.30
          REQUEST_ID="security-e2e-${TEST_ID}"
          COOKIE_ONE="/tmp/imdssa-security-cookie-one-${TEST_ID}"
          COOKIE_TWO="/tmp/imdssa-security-cookie-two-${TEST_ID}"
          COOKIE_THREE="/tmp/imdssa-security-cookie-three-${TEST_ID}"

          cleanup() {
            rm -f "$COOKIE_ONE" "$COOKIE_TWO" "$COOKIE_THREE"
            sudo -u postgres psql --dbname=imdssa --set=ON_ERROR_STOP=1 <<SQL >/dev/null 2>&1 || true
          delete from app.audit_logs where request_id='$REQUEST_ID';
          delete from app.login_attempts where normalized_email='$EMAIL' or source_ip in ('$ACCOUNT_IP'::inet,'$THROTTLE_IP'::inet,'$LOGIN_IP'::inet);
          delete from app.platform_users where email='$EMAIL';
          SQL
          }
          trap cleanup EXIT

          HASH="$(PASSWORD="$PASSWORD_ONE" node --input-type=module -e "import { hashPassword } from '/opt/imds-super-admin/api/dist/security.js'; process.stdout.write(hashPassword(process.env.PASSWORD));")"
          sudo -u postgres psql --dbname=imdssa --set=ON_ERROR_STOP=1 --command="insert into app.platform_users(email,password_hash,full_name,global_role,is_active) values ('$EMAIL','$HASH','Security E2E','support',true)" >/dev/null

          for _ in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "X-Real-IP: $ACCOUNT_IP" -d "{\"email\":\"$EMAIL\",\"password\":\"wrong-password\"}" "$API/api/auth/login")"
            test "$code" = 401
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "X-Real-IP: $ACCOUNT_IP" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD_ONE\"}" "$API/api/auth/login")"
          test "$code" = 429
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select failed_login_attempts >= 5 and locked_until > now() from app.platform_users where email='$EMAIL'" | grep -q '^t$'

          sudo -u postgres psql --dbname=imdssa --set=ON_ERROR_STOP=1 --command="update app.platform_users set failed_login_attempts=0,locked_until=null where email='$EMAIL'; delete from app.login_attempts where normalized_email='$EMAIL'" >/dev/null

          for n in $(seq 1 20); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "X-Real-IP: $THROTTLE_IP" -d "{\"email\":\"missing-${TEST_ID}-${n}@invalid.imds\",\"password\":\"wrong-password\"}" "$API/api/auth/login")"
            test "$code" = 401
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "X-Real-IP: $THROTTLE_IP" -d "{\"email\":\"missing-${TEST_ID}-blocked@invalid.imds\",\"password\":\"wrong-password\"}" "$API/api/auth/login")"
          test "$code" = 429

          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$COOKIE_ONE" -H 'content-type: application/json' -H "X-Real-IP: $LOGIN_IP" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD_ONE\"}" "$API/api/auth/login")"
          test "$code" = 200
          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE_ONE" "$API/api/v1/audit")"
          test "$code" = 403
          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE_ONE" -H 'content-type: application/json' -d '{"name":"SHOULD-NOT-BE-CREATED"}' "$API/api/v1/organizations")"
          test "$code" = 403

          sudo -u postgres psql --dbname=imdssa --set=ON_ERROR_STOP=1 --command="update app.platform_users set global_role='auditor' where email='$EMAIL'" >/dev/null
          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE_ONE" "$API/api/v1/audit")"
          test "$code" = 200
          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE_ONE" -H 'content-type: application/json' -d '{"name":"SHOULD-NOT-BE-CREATED"}' "$API/api/v1/organizations")"
          test "$code" = 403

          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE_ONE" -c "$COOKIE_TWO" -H 'content-type: application/json' -H "X-Real-IP: $LOGIN_IP" -H "X-Request-ID: $REQUEST_ID" -d "{\"currentPassword\":\"$PASSWORD_ONE\",\"newPassword\":\"$PASSWORD_TWO\"}" "$API/api/auth/change-password")"
          test "$code" = 200
          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE_ONE" "$API/api/auth/me")"
          test "$code" = 401
          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE_TWO" "$API/api/auth/me")"
          test "$code" = 200

          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "X-Real-IP: $LOGIN_IP" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD_ONE\"}" "$API/api/auth/login")"
          test "$code" = 401
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$COOKIE_THREE" -H 'content-type: application/json' -H "X-Real-IP: $LOGIN_IP" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD_TWO\"}" "$API/api/auth/login")"
          test "$code" = 200

          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select action||'|'||coalesce(source_ip::text,'')||'|'||coalesce(request_id,'') from app.audit_logs where request_id='$REQUEST_ID' order by id desc limit 1" | grep -q "^auth.password.change|$LOGIN_IP|$REQUEST_ID$"
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select count(*) from app.organizations where name='SHOULD-NOT-BE-CREATED'" | grep -q '^0$'

          echo 'security_e2e=passed'
          REMOTE
