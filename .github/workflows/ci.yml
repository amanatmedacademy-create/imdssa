name: CI

on:
  push:
    branches: [main, 'agent/**', 'work/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_ENV: development
      VITE_APP_VERSION: 0.4.0
      VITE_RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repository
        run: npm run validate:repository

      - name: Type check Superadmin Web
        run: npm run lint

      - name: Type check platform contracts
        run: npm run lint --workspace @imds/platform-types

      - name: Type check Platform SDK
        run: npm run lint --workspace @imds/platform-sdk

      - name: Type check Platform API
        run: npm run lint --workspace @imds/platform-api

      - name: Build Superadmin Web
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: imds-super-admin-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
