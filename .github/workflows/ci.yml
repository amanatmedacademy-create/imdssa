name: CI

on:
  push:
    branches: [main, 'agent/**', 'work/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Type check application
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Install browser telemetry SDK dependencies
        working-directory: packages/telemetry-web
        run: npm install --no-audit --no-fund

      - name: Type check browser telemetry SDK
        working-directory: packages/telemetry-web
        run: npm run typecheck

      - name: Install server telemetry SDK dependencies
        working-directory: packages/telemetry-node
        run: npm install --no-audit --no-fund

      - name: Type check server telemetry SDK
        working-directory: packages/telemetry-node
        run: npm run typecheck
