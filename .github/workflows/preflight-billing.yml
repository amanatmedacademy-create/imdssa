name: Billing Migration Preflight
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: billing-migration-preflight
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify source
        run: |
          npm run lint --workspace @imds/vps-api
          npm run build --workspace @imds/vps-api
          VITE_RUNTIME=vps VITE_APP_ENV=production VITE_APP_VERSION=0.8.0 VITE_RELEASE_SHA="$GITHUB_SHA" IMDS_STRICT_ENV=true npm run build
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Preflight billing migrations against production schema copy
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_PASSWORD"
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          export SSHPASS
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/migrations/018_refunds_and_reconciliation.sql deploy/vps/migrations/019_refund_aware_payment_engine.sql deploy/vps/migrations/020_reconciliation_resilience.sql "$VPS_USER@$VPS_HOST:/tmp/"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          DB="imdssa_billing_preflight_${RANDOM}_$$"
          cleanup() {
            sudo -u postgres dropdb --if-exists "$DB" >/dev/null 2>&1 || true
            rm -f /tmp/018_refunds_and_reconciliation.sql /tmp/019_refund_aware_payment_engine.sql /tmp/020_reconciliation_resilience.sql /tmp/imdssa-schema-preflight.sql
          }
          trap cleanup EXIT
          sudo -u postgres createdb "$DB"
          sudo -u postgres pg_dump --schema-only --no-owner --no-privileges imdssa > /tmp/imdssa-schema-preflight.sql
          sudo -u postgres psql --set=ON_ERROR_STOP=1 --dbname="$DB" --file=/tmp/imdssa-schema-preflight.sql >/dev/null
          sudo -u postgres psql --set=ON_ERROR_STOP=1 --dbname="$DB" --file=/tmp/018_refunds_and_reconciliation.sql
          sudo -u postgres psql --set=ON_ERROR_STOP=1 --dbname="$DB" --file=/tmp/019_refund_aware_payment_engine.sql
          sudo -u postgres psql --set=ON_ERROR_STOP=1 --dbname="$DB" --file=/tmp/020_reconciliation_resilience.sql
          sudo -u postgres psql --dbname="$DB" --tuples-only --no-align --command="select to_regclass('app.billing_refunds') is not null and to_regclass('app.billing_reconciliation_runs') is not null and to_regprocedure('app.record_verified_billing_refund(text,text,text,numeric,uuid,timestamp with time zone,jsonb)') is not null and to_regprocedure('app.record_verified_billing_payment(uuid,text,numeric,text,text,timestamp with time zone,jsonb)') is not null and to_regprocedure('app.reconcile_billing_state(text)') is not null" | grep -q '^t$'
          REMOTE
      - name: Publish preflight status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='Billing migration/source preflight failed'
          if [ "$JOB_STATUS" = success ]; then state=success; description='Billing migration/source preflight passed'; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"imdssa/billing-preflight\",\"description\":\"$description\"}"
