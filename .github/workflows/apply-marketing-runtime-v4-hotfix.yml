name: Apply Marketing Runtime V4 Hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-marketing-runtime-v4-hotfix.yml
      - deploy/vps/marketing-runtime-v4.patch

permissions:
  contents: read
  statuses: write

concurrency:
  group: apply-marketing-runtime-v4-hotfix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate patch source
        run: |
          set -euo pipefail
          test -s deploy/vps/marketing-runtime-v4.patch
          grep -q 'protocol: 4' deploy/vps/marketing-runtime-v4.patch
          grep -q 'fail-closed-managed-organization-scope' deploy/vps/marketing-runtime-v4.patch

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload patch
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/marketing-runtime-v4.patch "$VPS_USER@$VPS_HOST:/tmp/marketing-runtime-v4.patch"

      - name: Create and activate patched release
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          APP_ROOT=/opt/imds-marketing
          CURRENT="$(readlink -f "$APP_ROOT/current")"
          test -n "$CURRENT" && test -d "$CURRENT"
          RELEASE_ID="hotfix-orgscope-v4-$(date -u +%Y%m%d%H%M%S)"
          NEXT="$APP_ROOT/releases/$RELEASE_ID"
          cleanup_failed_release() {
            if [ "$(readlink -f "$APP_ROOT/current" 2>/dev/null || true)" = "$NEXT" ]; then
              ln -sfn "$CURRENT" "$APP_ROOT/current"
              systemctl restart imds-marketing || true
            fi
            rm -rf "$NEXT"
          }
          trap cleanup_failed_release ERR

          cp -a "$CURRENT" "$NEXT"
          patch --dry-run -d "$NEXT" -p1 < /tmp/marketing-runtime-v4.patch
          patch -d "$NEXT" -p1 < /tmp/marketing-runtime-v4.patch
          grep -q 'protocol: 4' "$NEXT/server/platformControl.ts"
          grep -q 'fail-closed-managed-organization-scope' "$NEXT/server/platformControl.ts"
          grep -q 'platformEntitlementForTenant(tenantId, env)' "$NEXT/server/billingGateway.ts"
          grep -q 'platformEntitlementForTenant(companyId, env)' "$NEXT/server/branchQuotaGateway.ts"
          chown -R imds:imds "$NEXT"

          cd "$NEXT"
          sudo -u imds /usr/bin/npx --yes tsx -e "import('./server/platformControl.ts').then(()=>console.log('platformControl import ok'))" >/dev/null

          ln -sfn "$NEXT" "$APP_ROOT/current"
          systemctl restart imds-marketing
          for attempt in $(seq 1 20); do
            if systemctl is-active --quiet imds-marketing && curl -fsS --max-time 5 http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 2
          done
          source /etc/imds-platform-control.env
          INFO="$(curl -fsS --max-time 10 -H "Authorization: Bearer $IMDS_PLATFORM_CONTROL_TOKEN" http://127.0.0.1:8787/internal/platform/info)"
          printf '%s' "$INFO" | grep -q '"protocol":4'
          printf '%s' "$INFO" | grep -q 'fail-closed-managed-organization-scope'
          grep -q '^Environment=IMDS_BILLING_CONTROL_URL=http://127.0.0.1:8788$' /etc/systemd/system/imds-marketing.service
          trap - ERR
          printf 'previous=%s\ncurrent=%s\ninfo=%s\n' "$CURRENT" "$NEXT" "$INFO"
          REMOTE

      - name: Publish hotfix status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='Marketing runtime v4 hotfix failed or rolled back'
          if [ "$JOB_STATUS" = success ]; then state=success; description='Marketing runtime v4 hotfix active on VPS'; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg state "$state" --arg context 'imdssa/marketing-v4-hotfix' --arg description "$description" '{state:$state,context:$context,description:$description}')" >/dev/null
