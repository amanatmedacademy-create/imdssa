name: Report Sessions Control E2E

on:
  push:
    branches: [main]
    paths: ['.github/workflows/report-sessions-control-e2e.yml']
  workflow_run:
    workflows: ['Verify Main Sessions and Control Plane E2E']
    types: [completed]

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report verifier conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: '47'
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            RUN_ID="$EVENT_RUN_ID"
            CONCLUSION="$EVENT_CONCLUSION"
            HEAD_SHA="$EVENT_HEAD_SHA"
          else
            RUN_ID="$(gh run list --repo "$REPO" --workflow verify-main-sessions-control-e2e-v2.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
            test -n "$RUN_ID"
            gh run watch "$RUN_ID" --repo "$REPO" --exit-status || true
            CONCLUSION="$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion --jq '.conclusion')"
            HEAD_SHA="$(gh run view "$RUN_ID" --repo "$REPO" --json headSha --jq '.headSha')"
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "verifier_result=$CONCLUSION
run_id=$RUN_ID
head_sha=$HEAD_SHA"
