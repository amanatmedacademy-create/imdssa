name: Verify VPS Admin

on:
  push:
    branches:
      - agent/vps-control-plane
    paths:
      - .github/workflows/verify-vps-admin.yml

permissions:
  contents: read

jobs:
  verify-admin:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Inspect admin and prepare one-time key
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            sudo -u postgres psql -d imdssa -Atc "select email || ''|'' || global_role || ''|'' || is_active from app.platform_users where global_role=''platform_owner'' order by created_at asc limit 1" | sed "s/^/CURRENT_ADMIN=/"
            sudo install -d -m 0700 /root/imdssa-admin-verify
            sudo openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /root/imdssa-admin-verify/private.pem >/dev/null 2>&1
            sudo chmod 0600 /root/imdssa-admin-verify/private.pem
            sudo openssl pkey -in /root/imdssa-admin-verify/private.pem -pubout -out /root/imdssa-admin-verify/public.pem >/dev/null 2>&1
            printf "VERIFY_PUBLIC_KEY_BASE64="
            sudo base64 -w0 /root/imdssa-admin-verify/public.pem
            printf "\n"
          '
