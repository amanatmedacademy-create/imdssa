name: Probe Control Plane E2E Status

on:
  issues:
    types: [edited]

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  probe:
    if: github.event.issue.number == 47
    runs-on: ubuntu-latest
    steps:
      - name: Report latest Control Plane E2E run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          row="$(gh run list --repo "$REPO" --workflow control-plane-e2e.yml --limit 1 --json databaseId,status,conclusion,headSha,event,createdAt --jq '.[0]')"
          gh issue comment 47 --repo "$REPO" --body "fail_closed_probe=$row"
