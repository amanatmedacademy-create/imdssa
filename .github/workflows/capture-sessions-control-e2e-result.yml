name: Capture Sessions Control E2E Result

on:
  workflow_run:
    workflows: ['Verify Main Sessions and Control Plane E2E']
    types: [completed]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git pull --rebase origin main
          mkdir -p docs/internal
          rm -f docs/internal/sessions-control-e2e.ok docs/internal/sessions-control-e2e.failed
          if [ '${{ github.event.workflow_run.conclusion }}' = success ]; then
            printf 'sessions_and_control_plane_e2e=passed\nrun_id=%s\nhead_sha=%s\n' '${{ github.event.workflow_run.id }}' '${{ github.event.workflow_run.head_sha }}' > docs/internal/sessions-control-e2e.ok
            git add docs/internal/sessions-control-e2e.ok docs/internal/sessions-control-e2e.failed 2>/dev/null || true
            git commit -m 'record successful sessions and control plane E2E' || true
          else
            printf 'sessions_and_control_plane_e2e=failed\nconclusion=%s\nrun_id=%s\nhead_sha=%s\n' '${{ github.event.workflow_run.conclusion }}' '${{ github.event.workflow_run.id }}' '${{ github.event.workflow_run.head_sha }}' > docs/internal/sessions-control-e2e.failed
            git add docs/internal/sessions-control-e2e.failed docs/internal/sessions-control-e2e.ok 2>/dev/null || true
            git commit -m 'record failed sessions and control plane E2E' || true
          fi
          git push origin HEAD:main
