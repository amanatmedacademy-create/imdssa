name: Diagnose VPS White Screen

on:
  push:
    branches:
      - agent/vps-control-plane
    paths:
      - .github/workflows/diagnose-vps-white-screen.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          URL='http://89.207.250.55:8080'
          curl -fsS "$URL/" -o /tmp/index.html
          grep -oE '(src|href)="[^"]+"' /tmp/index.html | sed -E 's/^(src|href)="//;s/"$//' | while read -r path; do
            case "$path" in
              /assets/*) curl -fsSI "$URL$path" >/dev/null ;;
            esac
          done

      - name: Verify rendered login UI in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          URL='http://89.207.250.55:8080/'
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "$URL" > /tmp/dom.html 2>/tmp/chrome.err
          grep -q 'IMDS' /tmp/dom.html
          grep -q 'Вход в control plane' /tmp/dom.html
          grep -q '<form' /tmp/dom.html
          if grep -q '<div id="root"></div>' /tmp/dom.html; then
            echo 'root is still empty' >&2
            exit 1
          fi
          echo 'Rendered VPS login UI successfully'
