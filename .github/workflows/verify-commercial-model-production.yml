name: Verify Commercial Model Production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-commercial-model-production.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source
        env:
          VITE_RUNTIME: vps
          VITE_APP_ENV: production
          VITE_APP_VERSION: 0.8.0
          IMDS_STRICT_ENV: 'true'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint --workspace @imds/vps-api
          npm run build --workspace @imds/vps-api
          npm run lint
          npm run build
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Verify live Control Center
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          success=''
          for _ in $(seq 1 90); do
            if sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          API=http://127.0.0.1:8788
          systemctl is-active --quiet imds-super-admin-api.service
          test "$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select to_regclass('app.product_limit_catalog') is not null and to_regclass('app.product_module_prices') is not null and to_regclass('app.product_module_dependencies') is not null and to_regclass('app.product_plan_revisions') is not null")" = t
          test "$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select exists(select 1 from app.modules where code='marketing.ai' and status='published')")" = t
          test "$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select commercial_role from app.product_module_commercial c join app.modules m on m.id=c.module_id where m.code='marketing.voice-transcription' limit 1")" = feature
          PRODUCT_ID="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select id from app.products where code='imds-marketing' limit 1")"
          ADMIN_ID="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select id from app.platform_users where is_active=true and global_role in ('platform_owner','platform_admin') order by created_at limit 1")"
          test -n "$PRODUCT_ID" && test -n "$ADMIN_ID"
          TOKEN="$(openssl rand -hex 32)"; TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          trap 'sudo -u postgres psql --dbname=imdssa --command="delete from app.auth_sessions where token_hash='"'"'$TOKEN_HASH'"'"'" >/dev/null 2>&1 || true' EXIT
          sudo -u postgres psql --dbname=imdssa --command="insert into app.auth_sessions(user_id,token_hash,expires_at) values ('$ADMIN_ID'::uuid,'$TOKEN_HASH',now()+interval '5 minutes')" >/dev/null
          curl -fsS --max-time 15 -H "Cookie: imdssa_session=$TOKEN" "$API/api/v1/products/$PRODUCT_ID/commercial" -o /tmp/commercial.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/commercial.json'))
          assert d['product']['code']=='imds-marketing'
          assert any(m['code']=='marketing.ai' and m['commercial_role']=='module' for m in d['modules'])
          assert any(m['code']=='marketing.voice-transcription' and m['commercial_role']=='feature' for m in d['modules'])
          assert any(x['key']=='call_minutes' for x in d['limitCatalog'])
          assert any(x['key']=='ai_requests' for x in d['limitCatalog'])
          PY
          grep -R -q 'Здесь только продукты' /var/www/imds-super-admin/current/assets
          grep -R -q 'Коммерческий модуль' /var/www/imds-super-admin/current/assets
          REMOTE
            then success=1; break; fi
            sleep 5
          done
          test "$success" = 1
      - name: Record success
        run: |
          set -euo pipefail
          mkdir -p docs/internal
          printf 'commercial_model_production=passed\nverified_at=%s\n' "$(date -u +%FT%TZ)" > docs/internal/commercial-model-production.ok
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add docs/internal/commercial-model-production.ok
          git commit -m 'record commercial model production verification'
          git pull --rebase origin main
          git push origin HEAD:main
