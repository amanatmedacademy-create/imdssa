name: Watch Main Subscription Deploy
on:
  push:
    branches: [agent/watch-subscription-deploy]
    paths:
      - '.github/workflows/watch-main-subscription-deploy.yml'
permissions:
  actions: read
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/watch-subscription-deploy
          fetch-depth: 0
      - name: Watch exact main deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: 6c9dff9ac58a9ab8c941ab907b7191d73ffb9cae
        run: |
          set -euo pipefail
          RUN_ID=''
          for _ in $(seq 1 60); do
            RUN_ID="$(gh run list --repo "$REPO" --workflow deploy-vps-control-plane.yml --branch main --limit 20 --json databaseId,headSha --jq '.[] | select(.headSha == env.EXPECTED_SHA) | .databaseId' | head -1)"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status || true
          CONCLUSION="$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion --jq '.conclusion')"
          mkdir -p docs/internal
          {
            echo "main_deploy_sha=$EXPECTED_SHA"
            echo "main_deploy_run_id=$RUN_ID"
            echo "main_deploy_conclusion=$CONCLUSION"
            gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '.jobs[] | [.databaseId,.name,.conclusion] | @tsv'
          } > docs/internal/main-subscription-deploy-status.txt
      - name: Store result on watcher branch
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add docs/internal/main-subscription-deploy-status.txt
          git commit -m 'record main subscription deploy result'
          git push origin HEAD:agent/watch-subscription-deploy
