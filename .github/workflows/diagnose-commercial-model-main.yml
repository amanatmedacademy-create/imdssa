name: Diagnose Commercial Model Main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-commercial-model-main.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and probe
        shell: bash
        run: |
          set +e
          : > /tmp/diag.log
          npm install --no-audit --no-fund >>/tmp/diag.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then npm run lint --workspace @imds/vps-api >>/tmp/diag.log 2>&1; rc=$?; fi
          if [ $rc -eq 0 ]; then npm run build --workspace @imds/vps-api >>/tmp/diag.log 2>&1; rc=$?; fi
          if [ $rc -eq 0 ]; then VITE_RUNTIME=vps VITE_APP_ENV=production VITE_APP_VERSION=0.8.0 IMDS_STRICT_ENV=true npm run build >>/tmp/diag.log 2>&1; rc=$?; fi
          if [ $rc -eq 0 ]; then
            sudo apt-get update >/dev/null 2>&1 && sudo apt-get install -y sshpass >/dev/null 2>&1
            export SSHPASS="$VPS_PASSWORD"
            success=''
            for _ in $(seq 1 60); do
              if sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'sudo bash -s' >>/tmp/diag.log 2>&1 <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet imds-super-admin-api.service
          test "$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select to_regclass('app.product_limit_catalog') is not null and to_regclass('app.product_module_prices') is not null and to_regclass('app.product_plan_revisions') is not null")" = t
          test "$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select exists(select 1 from app.modules where code='marketing.ai' and status='published')")" = t
          test "$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select commercial_role from app.product_module_commercial c join app.modules m on m.id=c.module_id where m.code='marketing.voice-transcription' limit 1")" = feature
          grep -R -q 'Здесь только продукты' /var/www/imds-super-admin/current/assets
          grep -R -q 'Коммерческий модуль' /var/www/imds-super-admin/current/assets
          REMOTE
              then success=1; break; fi
              sleep 5
            done
            test "$success" = 1
            rc=$?
          fi
          mkdir -p docs/internal
          if [ $rc -eq 0 ]; then status=passed; else status=failed; fi
          { echo "commercial_model_diagnostic=$status"; echo "head=$GITHUB_SHA"; echo '--- tail ---'; tail -80 /tmp/diag.log; } > docs/internal/commercial-model-diagnostic.txt
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add docs/internal/commercial-model-diagnostic.txt
          git commit -m "record commercial model diagnostic $status" || true
          git pull --rebase origin main
          git push origin HEAD:main
          exit 0
# rerun with production convergence wait
