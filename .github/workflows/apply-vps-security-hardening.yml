name: Apply VPS Security Hardening
on:
  push:
    branches: ['agent/vps-security-hardening']
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vps-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted security changes
        run: python3 scripts/apply-security-hardening.py
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint --workspace @imds/vps-api
          npm run build --workspace @imds/vps-api
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/vps-api/src/index.ts src/vps/VpsApp.tsx deploy/vps/deploy-control-plane.sh
          git commit -m 'harden VPS authentication and account security'
          git push origin HEAD:agent/vps-security-hardening
