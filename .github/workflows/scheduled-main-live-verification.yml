name: Main Live Verification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: '47'
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch production deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-vps-control-plane.yml --repo "$REPO" --ref main
          sleep 5
          run_id="$(gh run list --repo "$REPO" --workflow deploy-vps-control-plane.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$REPO" --exit-status
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Verify live sessions and control plane
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' < scripts/verify-sessions-control-e2e.sh
      - name: Report success
        if: success()
        shell: bash
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "scheduled_verification=success
deploy_run=${{ steps.deploy.outputs.run_id }}
head_sha=${{ github.sha }}"
          gh issue close "$ISSUE" --repo "$REPO" --reason completed
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "scheduled_verification=failed
deploy_run=${{ steps.deploy.outputs.run_id }}
head_sha=${{ github.sha }}"
          gh issue close "$ISSUE" --repo "$REPO" --reason not-planned
