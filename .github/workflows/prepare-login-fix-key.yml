name: Prepare Login Fix Key

on:
  push:
    branches: [agent/vps-control-plane]
    paths: [.github/workflows/prepare-login-fix-key.yml]

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Generate one-time key
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            sudo rm -rf /root/imdssa-login-fix
            sudo install -d -m 0700 /root/imdssa-login-fix
            sudo openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /root/imdssa-login-fix/private.pem >/dev/null 2>&1
            sudo chmod 0600 /root/imdssa-login-fix/private.pem
            sudo openssl pkey -in /root/imdssa-login-fix/private.pem -pubout -out /root/imdssa-login-fix/public.pem >/dev/null 2>&1
            printf "LOGIN_FIX_PUBLIC_KEY_BASE64="
            sudo base64 -w0 /root/imdssa-login-fix/public.pem
            printf "\n"
          '
