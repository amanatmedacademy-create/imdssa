name: Apply Registration Center

on:
  push:
    branches: ['agent/registration-center-telegram-settings']
    paths:
      - 'scripts/apply-registration-center.py'
      - '.github/workflows/apply-registration-center.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-registration-center.py'
      - '.github/workflows/apply-registration-center.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/registration-center-telegram-settings' || github.ref_name == 'agent/registration-center-telegram-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/registration-center-telegram-settings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patch
        run: python3 scripts/apply-registration-center.py
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint --workspace @imds/vps-api
          npm run build --workspace @imds/vps-api
          npm run lint
          npm run build
      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add apps/vps-api/src/index.ts apps/vps-api/src/registrationNotifications.ts src/vps/VpsApp.tsx deploy/vps/deploy-control-plane.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'connect registration center and Telegram settings'
            git pull --rebase origin agent/registration-center-telegram-settings
            git push origin HEAD:agent/registration-center-telegram-settings
          fi
