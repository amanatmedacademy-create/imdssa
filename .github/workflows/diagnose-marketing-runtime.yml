name: Diagnose Marketing VPS Runtime

on:
  push:
    branches:
      - agent/vps-control-plane
    paths:
      - .github/workflows/diagnose-marketing-runtime.yml

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Inspect Marketing runtime
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            echo SERVICE_STATE
            sudo systemctl is-active imds-marketing.service || true
            echo SERVICE_STATUS
            sudo systemctl status imds-marketing.service --no-pager -l || true
            echo LISTEN_8787
            sudo ss -ltnp | grep ":8787" || true
            echo LOCAL_HEALTH
            curl -sS -i --max-time 5 http://127.0.0.1:8787/api/health || true
            echo JOURNAL
            sudo journalctl -u imds-marketing.service -n 100 --no-pager || true
          '
