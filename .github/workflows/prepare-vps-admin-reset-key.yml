name: Prepare VPS Admin Reset Key

on:
  push:
    branches:
      - agent/vps-control-plane
    paths:
      - .github/workflows/prepare-vps-admin-reset-key.yml

permissions:
  contents: read

jobs:
  prepare-key:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Generate one-time reset key on VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            sudo install -d -m 0700 /root/imdssa-admin-reset
            if [ ! -f /root/imdssa-admin-reset/private.pem ]; then
              sudo openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /root/imdssa-admin-reset/private.pem >/dev/null 2>&1
              sudo chmod 0600 /root/imdssa-admin-reset/private.pem
            fi
            sudo openssl pkey -in /root/imdssa-admin-reset/private.pem -pubout -out /root/imdssa-admin-reset/public.pem >/dev/null 2>&1
            sudo chmod 0644 /root/imdssa-admin-reset/public.pem
            printf "IMDSSA_RESET_PUBLIC_KEY_BASE64="
            sudo base64 -w0 /root/imdssa-admin-reset/public.pem
            printf "\n"
          '
