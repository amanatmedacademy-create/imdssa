name: Apply Marketing Plan Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/vps/migrations/021_marketing_plan_catalog.sql
      - .github/workflows/apply-marketing-plan-catalog.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: apply-marketing-plan-catalog
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Apply migration and verify catalog
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e scp "${SSH_ARGS[@]}" deploy/vps/migrations/021_marketing_plan_catalog.sql "$VPS_USER@$VPS_HOST:/tmp/021_marketing_plan_catalog.sql"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -u postgres psql --set=ON_ERROR_STOP=1 --dbname=imdssa --file=/tmp/021_marketing_plan_catalog.sql >/dev/null
          PRODUCT_ID="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select id from app.products where code='imds-marketing' limit 1")"
          test -n "$PRODUCT_ID"
          PLANS="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select count(*) from app.product_plans where product_id='$PRODUCT_ID'::uuid and status='published' and code in ('start','pro','business','enterprise')")"
          FIXED_PRICES="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select count(*) from app.product_plan_prices pp join app.product_plans p on p.id=pp.plan_id where p.product_id='$PRODUCT_ID'::uuid and p.code in ('start','pro','business') and pp.months in (1,3,6,12) and pp.amount_kzt>0")"
          PRO_RECOMMENDED="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select featured from app.product_plans where product_id='$PRODUCT_ID'::uuid and code='pro'")"
          START_PRICE="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select pp.amount_kzt::bigint from app.product_plan_prices pp join app.product_plans p on p.id=pp.plan_id where p.product_id='$PRODUCT_ID'::uuid and p.code='start' and pp.months=1")"
          PRO_PRICE="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select pp.amount_kzt::bigint from app.product_plan_prices pp join app.product_plans p on p.id=pp.plan_id where p.product_id='$PRODUCT_ID'::uuid and p.code='pro' and pp.months=1")"
          BUSINESS_PRICE="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select pp.amount_kzt::bigint from app.product_plan_prices pp join app.product_plans p on p.id=pp.plan_id where p.product_id='$PRODUCT_ID'::uuid and p.code='business' and pp.months=1")"
          test "$PLANS" -eq 4
          test "$FIXED_PRICES" -eq 12
          test "$PRO_RECOMMENDED" = t
          test "$START_PRICE" = 49900
          test "$PRO_PRICE" = 99900
          test "$BUSINESS_PRICE" = 249900
          printf 'plans=%s fixed_prices=%s start=%s pro=%s business=%s\n' "$PLANS" "$FIXED_PRICES" "$START_PRICE" "$PRO_PRICE" "$BUSINESS_PRICE"
          rm -f /tmp/021_marketing_plan_catalog.sql
          REMOTE
      - name: Publish catalog status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='Marketing centralized plan catalog failed'
          if [ "$JOB_STATUS" = success ]; then state=success; description='Marketing Start/Pro/Business/Enterprise catalog ready'; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg state "$state" --arg context 'imdssa/marketing-plan-catalog' --arg description "$description" '{state:$state,context:$context,description:$description}')" >/dev/null
