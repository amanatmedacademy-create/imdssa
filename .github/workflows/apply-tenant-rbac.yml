name: Apply Tenant RBAC

on:
  push:
    branches: ['agent/tenant-rbac-isolation']
    paths: ['.github/workflows/apply-tenant-rbac.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tenant-rbac-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped API integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          index_path = Path('apps/vps-api/src/index.ts')
          text = index_path.read_text()
          text = replace_once(text,
              "import { createSessionToken, hashPassword, hashToken, validatePassword, verifyPassword } from './security.js';\n",
              "import { createSessionToken, hashPassword, hashToken, validatePassword, verifyPassword } from './security.js';\nimport { handleTenantApi } from './tenantRoutes.js';\nimport { loadTenantAccess, organizationIds, serializeMemberships } from './tenantAccess.js';\n",
              'tenant imports')
          text = replace_once(text,
              "const listeners = new Set<ServerResponse>();\n\ntype User = { id: string; email: string; full_name: string; global_role: string; is_active: boolean };",
              "type ListenerScope = { isPlatformUser: boolean; organizationIds: Set<string> };\nconst listeners = new Map<ServerResponse, ListenerScope>();\n\ntype User = { id: string; email: string; full_name: string; global_role: string | null; is_active: boolean };",
              'listener scope')

          old_login = """    setSessionCookie(res, session.token);\n    return json(res, 200, { user: { id: row.id, email: row.email, fullName: row.full_name, role: row.global_role } });\n"""
          new_login = """    const access = await loadTenantAccess(pool, row);\n    setSessionCookie(res, session.token);\n    return json(res, 200, { user: { id: row.id, email: row.email, fullName: row.full_name, role: row.global_role || access.memberships[0]?.role || 'member', scope: access.isPlatformUser ? 'platform' : 'tenant', memberships: serializeMemberships(access) } });\n"""
          text = replace_once(text, old_login, new_login, 'login response')

          old_me = """    return json(res, 200, { user: { id: user.id, email: user.email, fullName: user.full_name, role: user.global_role } });\n"""
          new_me = """    const access = await loadTenantAccess(pool, user);\n    return json(res, 200, { user: { id: user.id, email: user.email, fullName: user.full_name, role: user.global_role || access.memberships[0]?.role || 'member', scope: access.isPlatformUser ? 'platform' : 'tenant', memberships: serializeMemberships(access) } });\n"""
          text = replace_once(text, old_me, new_me, 'me response')

          old_change = """    setSessionCookie(res, session.token);\n    return json(res, 200, { user: { id: user.id, email: user.email, fullName: user.full_name, role: user.global_role } });\n  }\n\n  if (url.pathname === '/events' && method === 'GET') {\n"""
          new_change = """    const access = await loadTenantAccess(pool, user);\n    setSessionCookie(res, session.token);\n    return json(res, 200, { user: { id: user.id, email: user.email, fullName: user.full_name, role: user.global_role || access.memberships[0]?.role || 'member', scope: access.isPlatformUser ? 'platform' : 'tenant', memberships: serializeMemberships(access) } });\n  }\n\n  if (url.pathname === '/events' && method === 'GET') {\n"""
          text = replace_once(text, old_change, new_change, 'password response')

          old_events = """  if (url.pathname === '/events' && method === 'GET') {\n    const user = await requireUser(req, res); if (!user) return;\n    res.writeHead(200, { 'content-type': 'text/event-stream', 'cache-control': 'no-cache', connection: 'keep-alive', 'x-accel-buffering': 'no' });\n    listeners.add(res);\n    res.write(`event: ready\\ndata: ${JSON.stringify({ ok: true })}\\n\\n`);\n    const heartbeat = setInterval(() => res.write(': heartbeat\\n\\n'), 15000);\n    req.on('close', () => { clearInterval(heartbeat); listeners.delete(res); });\n    return;\n  }\n\n  const user = await requireUser(req, res); if (!user) return;\n"""
          new_events = """  if (url.pathname === '/events' && method === 'GET') {\n    const user = await requireUser(req, res); if (!user) return;\n    const access = await loadTenantAccess(pool, user);\n    res.writeHead(200, { 'content-type': 'text/event-stream', 'cache-control': 'no-cache', connection: 'keep-alive', 'x-accel-buffering': 'no' });\n    listeners.set(res, { isPlatformUser: access.isPlatformUser, organizationIds: new Set(organizationIds(access)) });\n    res.write(`event: ready\\ndata: ${JSON.stringify({ ok: true, scope: access.isPlatformUser ? 'platform' : 'tenant' })}\\n\\n`);\n    const heartbeat = setInterval(() => res.write(': heartbeat\\n\\n'), 15000);\n    req.on('close', () => { clearInterval(heartbeat); listeners.delete(res); });\n    return;\n  }\n\n  const user = await requireUser(req, res); if (!user) return;\n  const access = await loadTenantAccess(pool, user);\n  if (await handleTenantApi({ req, res, pool, url, method, user, scope: access, json })) return;\n  if (!access.isPlatformUser && url.pathname.startsWith('/api/v1/')) return json(res, 403, { error: 'TENANT_SCOPE_REQUIRED' });\n"""
          text = replace_once(text, old_events, new_events, 'events isolation')

          text = text.replace("if (!['platform_owner','platform_admin','auditor'].includes(user.global_role))", "if (!user.global_role || !['platform_owner','platform_admin','auditor'].includes(user.global_role))")

          old_listener = """  for (const res of listeners) sse(res, event);\n});\n"""
          new_listener = """  const eventOrganizationId = typeof event === 'object' && event !== null && 'organization_id' in event ? String((event as { organization_id?: unknown }).organization_id || '') : '';\n  for (const [res, scope] of listeners) {\n    if (scope.isPlatformUser || (eventOrganizationId && scope.organizationIds.has(eventOrganizationId))) sse(res, event);\n  }\n});\n"""
          text = replace_once(text, old_listener, new_listener, 'listener filter')
          index_path.write_text(text)

          deploy_path = Path('deploy/vps/deploy-control-plane.sh')
          deploy = deploy_path.read_text()
          deploy = replace_once(deploy,
              '005_registration_notifications.sql 005_security_hardening.sql; do',
              '005_registration_notifications.sql 005_security_hardening.sql 006_tenant_rbac.sql; do',
              'deploy migration list')
          deploy_path.write_text(deploy)

          ui_path = Path('src/vps/VpsApp.tsx')
          ui = ui_path.read_text()
          ui = replace_once(ui,
              "type User = { id: string; email: string; fullName: string; role: string };",
              "type User = { id: string; email: string; fullName: string; role: string; scope: 'platform' | 'tenant'; memberships?: Array<{ organizationId: string; role: string }> };",
              'ui user scope')
          ui = replace_once(ui,
              "  const [passwordMessage, setPasswordMessage] = useState('');\n\n  const refresh = useCallback(async () => {",
              "  const [passwordMessage, setPasswordMessage] = useState('');\n  const apiRoot = user?.scope === 'tenant' ? '/api/tenant/v1' : '/api/v1';\n\n  const refresh = useCallback(async () => {",
              'ui api root')
          ui = replace_once(ui,
              "api<Overview>('/api/v1/overview'), api<{ items: Organization[] }>('/api/v1/organizations'), api<{ items: Product[] }>('/api/v1/products'), api<{ items: Module[] }>('/api/v1/modules'), api<{ items: Installation[] }>('/api/v1/installations'), api<{ items: OrganizationProduct[] }>('/api/v1/organization-products'), api<{ items: ControlCommand[] }>('/api/v1/control-commands'),",
              "api<Overview>(`${apiRoot}/overview`), api<{ items: Organization[] }>(`${apiRoot}/organizations`), api<{ items: Product[] }>(`${apiRoot}/products`), api<{ items: Module[] }>(`${apiRoot}/modules`), api<{ items: Installation[] }>(`${apiRoot}/installations`), api<{ items: OrganizationProduct[] }>(`${apiRoot}/organization-products`), api<{ items: ControlCommand[] }>(`${apiRoot}/control-commands`),",
              'ui scoped refresh')
          ui = replace_once(ui, "  }, []);\n\n  useEffect(() => { api<{ user: User }>('/api/auth/me')", "  }, [apiRoot]);\n\n  useEffect(() => { api<{ user: User }>('/api/auth/me')", 'ui refresh dependency')
          ui = replace_once(ui,
              "  if (!user) return <Login onReady={setUser} />;\n\n  const logout",
              "  if (!user) return <Login onReady={setUser} />;\n  const canManagePlatform = user.scope === 'platform' && ['platform_owner', 'platform_admin'].includes(user.role);\n\n  const logout",
              'ui management flag')
          ui = replace_once(ui,
              "<header className=\"vps-header\"><div><span className=\"vps-eyebrow\">ЦЕНТР УПРАВЛЕНИЯ IMDS</span><h1>{tabTitles[tab]}</h1></div><div className={`vps-live ${realtimeState}`}>",
              "<header className=\"vps-header\"><div><span className=\"vps-eyebrow\">ЦЕНТР УПРАВЛЕНИЯ IMDS</span><h1>{tabTitles[tab]}</h1></div><div className={`vps-live ${realtimeState}`}>",
              'ui header anchor')
          ui = ui.replace("<small>{user.role}</small>", "<small>{user.scope === 'tenant' ? `Организация · ${user.role}` : user.role}</small>", 1)
          ui = ui.replace("{error && <div className=\"vps-error\">API: {error}</div>}", "{error && <div className=\"vps-error\">API: {error}</div>}{!canManagePlatform && user.scope === 'tenant' && <div className=\"vps-note\">Tenant scope: доступны только назначенные организации, продукты и модули. Изменения платформенных entitlement выполняет IMDS Super Admin.</div>}", 1)
          ui_path.write_text(ui)
          PY
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint --workspace @imds/vps-api
          npm run build --workspace @imds/vps-api
          npm run typecheck
      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add apps/vps-api/src/index.ts deploy/vps/deploy-control-plane.sh src/vps/VpsApp.tsx
          git diff --cached --check
          git commit -m 'enforce tenant-scoped control plane access'
          git push origin HEAD:agent/tenant-rbac-isolation
