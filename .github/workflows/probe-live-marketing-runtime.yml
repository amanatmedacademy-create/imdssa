name: Probe Live Marketing Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-live-marketing-runtime.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: probe-live-marketing-runtime
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Probe and publish detailed runtime checks
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_PASSWORD"
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          OUTPUT="$(sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          source /etc/imds-platform-control.env
          SERVICE="$(systemctl is-active imds-marketing 2>/dev/null || true)"
          HEALTH_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8787/api/health || true)"
          BILLING_URL="$(systemctl cat imds-marketing 2>/dev/null | sed -n 's/^Environment=IMDS_BILLING_CONTROL_URL=//p' | tail -n1)"
          INFO="$(curl -sS --max-time 10 -H "Authorization: Bearer $IMDS_PLATFORM_CONTROL_TOKEN" http://127.0.0.1:8787/internal/platform/info || true)"
          PROTOCOL="$(printf '%s' "$INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("protocol",0))' 2>/dev/null || echo 0)"
          MODE="$(printf '%s' "$INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("entitlementMode","unknown"))' 2>/dev/null || echo unknown)"
          printf 'service=%s\nhealth=%s\nbilling=%s\nprotocol=%s\nmode=%s\n' "$SERVICE" "$HEALTH_CODE" "$BILLING_URL" "$PROTOCOL" "$MODE"
          REMOTE
          )"
          printf '%s\n' "$OUTPUT"
          service="$(printf '%s\n' "$OUTPUT" | sed -n 's/^service=//p')"
          health="$(printf '%s\n' "$OUTPUT" | sed -n 's/^health=//p')"
          billing="$(printf '%s\n' "$OUTPUT" | sed -n 's/^billing=//p')"
          protocol="$(printf '%s\n' "$OUTPUT" | sed -n 's/^protocol=//p')"
          mode="$(printf '%s\n' "$OUTPUT" | sed -n 's/^mode=//p')"
          post() {
            local context="$1" state="$2" description="$3"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "$(jq -nc --arg state "$state" --arg context "$context" --arg description "$description" '{state:$state,context:$context,description:$description}')" >/dev/null
          }
          [ "$service" = active ] && post imdssa/marketing-service success 'imds-marketing service active' || post imdssa/marketing-service failure "service=$service"
          [ "$health" = 200 ] && post imdssa/marketing-health success 'Marketing health HTTP 200' || post imdssa/marketing-health failure "health=$health"
          [ "$billing" = http://127.0.0.1:8788 ] && post imdssa/marketing-billing-url success 'Billing points to local Control Center 8788' || post imdssa/marketing-billing-url failure "billing=$billing"
          [ "$protocol" = 4 ] && post imdssa/marketing-protocol4 success 'Marketing platform protocol 4 live' || post imdssa/marketing-protocol4 failure "protocol=$protocol"
          [ "$mode" = fail-closed-managed-organization-scope ] && post imdssa/marketing-org-scope success 'Organization-scoped fail-closed entitlement live' || post imdssa/marketing-org-scope failure "mode=$mode"
          if [ "$service" = active ] && [ "$health" = 200 ] && [ "$billing" = http://127.0.0.1:8788 ] && [ "$protocol" = 4 ] && [ "$mode" = fail-closed-managed-organization-scope ]; then
            post imdssa/marketing-runtime-probe success 'Marketing protocol 4 live on VPS'
          else
            post imdssa/marketing-runtime-probe failure 'Marketing live runtime needs update'
          fi
