name: Diagnose Subscription Control
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-subscription-control.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and probe
        shell: bash
        run: |
          set +e
          : > /tmp/subscription-diag.log
          npm install --no-audit --no-fund >>/tmp/subscription-diag.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then npm run lint --workspace @imds/vps-api >>/tmp/subscription-diag.log 2>&1; rc=$?; fi
          if [ $rc -eq 0 ]; then npm run build --workspace @imds/vps-api >>/tmp/subscription-diag.log 2>&1; rc=$?; fi
          if [ $rc -eq 0 ]; then VITE_RUNTIME=vps VITE_APP_ENV=production VITE_APP_VERSION=0.8.0 IMDS_STRICT_ENV=true npm run build >>/tmp/subscription-diag.log 2>&1; rc=$?; fi
          phase=source
          if [ $rc -eq 0 ]; then
            phase=vps
            sudo apt-get update >/dev/null 2>&1 && sudo apt-get install -y sshpass >/dev/null 2>&1
            export SSHPASS="$VPS_PASSWORD"
            sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'sudo bash -s' >>/tmp/subscription-diag.log 2>&1 <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet imds-super-admin-api.service
          curl -fsS --max-time 10 http://127.0.0.1:8788/healthz >/dev/null
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select to_regclass('app.product_subscriptions') is not null and to_regclass('app.product_subscription_items') is not null and to_regclass('app.product_subscription_events') is not null" | grep -q '^t$'
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select not exists(select 1 from app.organization_products op left join app.product_subscriptions s on s.organization_id=op.organization_id and s.product_id=op.product_id where s.id is null)" | grep -q '^t$'
          grep -R -q 'Подписки и тарифы' /var/www/imds-super-admin/current/assets
          REMOTE
            rc=$?
          fi
          mkdir -p docs/internal
          if [ $rc -eq 0 ]; then status=passed; else status=failed; fi
          { echo "subscription_control_diagnostic=$status"; echo "phase=$phase"; echo "head=$GITHUB_SHA"; echo '--- tail ---'; tail -120 /tmp/subscription-diag.log; } > docs/internal/subscription-control-diagnostic.txt
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add docs/internal/subscription-control-diagnostic.txt
          git commit -m "record subscription control diagnostic $status" || true
          git pull --rebase origin main
          git push origin HEAD:main
          exit 0
