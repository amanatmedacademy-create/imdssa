name: Watch Billing VPS Deploy
on:
  push:
    branches: [agent/watch-billing-vps-deploy]
    paths: ['.github/workflows/watch-billing-vps-deploy.yml']
permissions:
  contents: write
  actions: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/watch-billing-vps-deploy
          fetch-depth: 0
      - name: Wait for production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 7220490ad48b353e102f285c58133fab57a416e3
        run: |
          set -euo pipefail
          RUN_ID=''
          for _ in $(seq 1 120); do
            RUN_ID="$(gh run list --repo "$REPO" --workflow deploy-vps-control-plane.yml --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n1)"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status || true
          CONCLUSION="$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion --jq '.conclusion')"
          mkdir -p docs/internal
          {
            echo "billing_vps_target=$TARGET_SHA"
            echo "billing_vps_run_id=$RUN_ID"
            echo "billing_vps_conclusion=$CONCLUSION"
            gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '.jobs[] | [.name,.conclusion] | @tsv'
          } > docs/internal/billing-vps-deploy-status.txt
      - name: Publish marker
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add docs/internal/billing-vps-deploy-status.txt
          git commit -m 'record billing VPS deploy status'
          git push origin HEAD:agent/watch-billing-vps-deploy
