name: Deploy VPS Control Plane
on:
  push:
    branches: ['agent/vps-control-plane']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-vps-control-plane
  cancel-in-progress: true
env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: 'test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_PASSWORD"'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint --workspace @imds/vps-api
      - run: npm run build --workspace @imds/vps-api
      - name: Build real-only frontend
        env:
          VITE_RUNTIME: vps
          VITE_APP_ENV: production
          VITE_APP_VERSION: 0.7.0
          VITE_RELEASE_SHA: ${{ github.sha }}
          IMDS_STRICT_ENV: 'true'
        run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Stage release
        run: |
          mkdir -p .deploy-stage/web .deploy-stage/api/dist
          cp -a dist/. .deploy-stage/web/
          cp -a apps/vps-api/dist/. .deploy-stage/api/dist/
          cp apps/vps-api/package.json .deploy-stage/api/package.json
          cp deploy/vps/migrations/002_auth_sessions.sql .deploy-stage/002_auth_sessions.sql
          cp deploy/vps/migrations/003_platform_management.sql .deploy-stage/003_platform_management.sql
          cp deploy/vps/migrations/004_control_plane_sync.sql .deploy-stage/004_control_plane_sync.sql
          cp deploy/vps/nginx-super-admin.conf .deploy-stage/nginx.conf
          cp deploy/vps/deploy-control-plane.sh .deploy-stage/deploy-control-plane.sh
          cp deploy/vps/product-monitor.sh .deploy-stage/product-monitor.sh
          cp deploy/vps/imdssa-product-monitor.service .deploy-stage/product-monitor.service
          cp deploy/vps/imdssa-product-monitor.timer .deploy-stage/product-monitor.timer
          cp deploy/vps/imdssa-reconcile.service .deploy-stage/reconcile.service
          cp deploy/vps/imdssa-reconcile.timer .deploy-stage/reconcile.timer
      - name: Upload and deploy
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/imdssa-release && mkdir -p /tmp/imdssa-release'
          sshpass -e scp "${SSH_ARGS[@]}" -r .deploy-stage/. "$VPS_USER@$VPS_HOST:/tmp/imdssa-release/"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "sudo install -m 0750 /tmp/imdssa-release/deploy-control-plane.sh /opt/imds-super-admin/deploy-control-plane.sh && sudo /opt/imds-super-admin/deploy-control-plane.sh '${GITHUB_SHA}' /tmp/imdssa-release"
      - name: Verify local Marketing control channel
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          source /etc/imds-platform-control.env
          test -n "${IMDS_PLATFORM_CONTROL_TOKEN:-}"

          info="$(curl -fsS --max-time 10 -H "Authorization: Bearer $IMDS_PLATFORM_CONTROL_TOKEN" http://127.0.0.1:8787/internal/platform/info)"
          printf '%s\n' "$info" | grep -q '"product":"imds-marketing"'
          echo 'MARKETING_PLATFORM_INFO=ok'

          tenants="$(curl -fsS --max-time 10 -H "Authorization: Bearer $IMDS_PLATFORM_CONTROL_TOKEN" http://127.0.0.1:8787/internal/platform/tenants)"
          printf '%s\n' "$tenants" | grep -q '"items"'
          echo 'MARKETING_TENANT_DIRECTORY=ok'

          echo "RECONCILE_TIMER=$(systemctl is-active imdssa-reconcile.timer)"
          echo "MONITOR_TIMER=$(systemctl is-active imdssa-product-monitor.timer)"
          systemctl is-active --quiet imdssa-reconcile.timer
          systemctl is-active --quiet imdssa-product-monitor.timer

          systemctl start imdssa-reconcile.service || true
          sleep 2

          echo 'CONTROL_BINDINGS'
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --field-separator='|' --command="
            select o.name,p.code,coalesce(b.remote_tenant_id,''),b.desired_revision,b.actual_revision,b.sync_status,coalesce(b.last_error,'')
            from app.product_tenant_bindings b
            join app.organizations o on o.id=b.organization_id
            join app.products p on p.id=b.product_id
            where p.code='imds-marketing'
            order by o.name;"

          echo 'CONTROL_COMMANDS'
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --field-separator='|' --command="
            select c.status,count(*)
            from app.control_commands c
            join app.products p on p.id=c.product_id
            where p.code='imds-marketing'
            group by c.status
            order by c.status;"
          REMOTE
      - name: Verify public endpoint
        run: |
          curl -fsS --max-time 20 "http://$VPS_HOST:8080/healthz"
          curl -fsS --max-time 20 "http://$VPS_HOST:8080/" | grep -qi '<div id="root"'
