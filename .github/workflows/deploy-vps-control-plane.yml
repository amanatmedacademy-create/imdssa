name: Deploy VPS Control Plane
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: deploy-vps-control-plane
  cancel-in-progress: true
env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: 'test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_PASSWORD"'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint --workspace @imds/vps-api
      - run: npm run build --workspace @imds/vps-api
      - name: Build real-only frontend
        env:
          VITE_RUNTIME: vps
          VITE_APP_ENV: production
          VITE_APP_VERSION: 0.8.0
          VITE_RELEASE_SHA: ${{ github.sha }}
          IMDS_STRICT_ENV: 'true'
        run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Stage release
        run: |
          mkdir -p .deploy-stage/web .deploy-stage/api/dist
          cp -a dist/. .deploy-stage/web/
          cp -a apps/vps-api/dist/. .deploy-stage/api/dist/
          cp apps/vps-api/package.json .deploy-stage/api/package.json
          cp deploy/vps/migrations/002_auth_sessions.sql .deploy-stage/002_auth_sessions.sql
          cp deploy/vps/migrations/003_platform_management.sql .deploy-stage/003_platform_management.sql
          cp deploy/vps/migrations/004_control_plane_sync.sql .deploy-stage/004_control_plane_sync.sql
          cp deploy/vps/migrations/005_registration_notifications.sql .deploy-stage/005_registration_notifications.sql
          cp deploy/vps/migrations/005_security_hardening.sql .deploy-stage/005_security_hardening.sql
          cp deploy/vps/migrations/006_tenant_rbac.sql .deploy-stage/006_tenant_rbac.sql
          cp deploy/vps/migrations/007_notification_delivery_settings.sql .deploy-stage/007_notification_delivery_settings.sql
          cp deploy/vps/migrations/009_tenant_user_access.sql .deploy-stage/009_tenant_user_access.sql
          cp deploy/vps/migrations/010_product_commercial_catalog.sql .deploy-stage/010_product_commercial_catalog.sql
          cp deploy/vps/migrations/011_product_commercial_model.sql .deploy-stage/011_product_commercial_model.sql
          cp deploy/vps/migrations/012_organization_product_subscriptions.sql .deploy-stage/012_organization_product_subscriptions.sql
          cp deploy/vps/migrations/014_billing_invoices_payments.sql .deploy-stage/014_billing_invoices_payments.sql
          cp deploy/vps/nginx-super-admin.conf .deploy-stage/nginx.conf
          cp deploy/vps/deploy-control-plane.sh .deploy-stage/deploy-control-plane.sh
          cp deploy/vps/product-monitor.sh .deploy-stage/product-monitor.sh
          cp deploy/vps/imdssa-product-monitor.service .deploy-stage/product-monitor.service
          cp deploy/vps/imdssa-product-monitor.timer .deploy-stage/product-monitor.timer
          cp deploy/vps/imdssa-reconcile.service .deploy-stage/reconcile.service
          cp deploy/vps/imdssa-reconcile.timer .deploy-stage/reconcile.timer
      - name: Upload and deploy
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/imdssa-release && mkdir -p /tmp/imdssa-release'
          sshpass -e scp "${SSH_ARGS[@]}" -r .deploy-stage/. "$VPS_USER@$VPS_HOST:/tmp/imdssa-release/"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "sudo install -m 0750 /tmp/imdssa-release/deploy-control-plane.sh /opt/imds-super-admin/deploy-control-plane.sh && sudo /opt/imds-super-admin/deploy-control-plane.sh '${GITHUB_SHA}' /tmp/imdssa-release"
      - name: Verify Control Center authenticated runtime
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          API=http://127.0.0.1:8788
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          ADMIN_ID="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select id from app.platform_users where is_active=true and global_role in ('platform_owner','platform_admin') order by case global_role when 'platform_owner' then 0 else 1 end, created_at limit 1")"
          PRODUCT_ID="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select id from app.products where code='imds-marketing' limit 1")"
          test -n "$ADMIN_ID" && test -n "$PRODUCT_ID"
          sudo -u postgres psql --dbname=imdssa --set=ON_ERROR_STOP=1 --command="insert into app.auth_sessions(user_id,token_hash,expires_at) values ('$ADMIN_ID'::uuid,'$TOKEN_HASH',now()+interval '10 minutes')" >/dev/null
          cleanup() { sudo -u postgres psql --dbname=imdssa --command="delete from app.auth_sessions where token_hash='$TOKEN_HASH'" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for route in /api/auth/me /api/v1/overview /api/v1/control-commands /api/v1/notifications /api/v1/settings/notifications/telegram /api/v1/access/users /api/v1/subscriptions /api/v1/billing/overview /api/v1/billing/invoices /api/v1/billing/payments "/api/v1/products/$PRODUCT_ID/commercial"; do
            curl -fsS --max-time 15 -H "Cookie: imdssa_session=$TOKEN" "$API$route" >/dev/null
          done
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select to_regclass('app.organization_memberships') is not null" | grep -q '^t$'
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select to_regclass('app.product_limit_catalog') is not null and to_regclass('app.product_module_prices') is not null and to_regclass('app.product_module_dependencies') is not null and to_regclass('app.product_plan_revisions') is not null" | grep -q '^t$'
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select to_regclass('app.product_subscriptions') is not null and to_regclass('app.product_subscription_items') is not null and to_regclass('app.product_subscription_events') is not null" | grep -q '^t$'
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select to_regclass('app.billing_accounts') is not null and to_regclass('app.billing_invoices') is not null and to_regclass('app.billing_invoice_lines') is not null and to_regclass('app.billing_payments') is not null and to_regclass('app.billing_payment_allocations') is not null and to_regclass('app.billing_events') is not null" | grep -q '^t$'
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select not exists(select 1 from app.organization_products op left join app.product_subscriptions s on s.organization_id=op.organization_id and s.product_id=op.product_id where s.id is null)" | grep -q '^t$'
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select exists(select 1 from app.modules where code='marketing.ai' and status='published')" | grep -q '^t$'
          sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select commercial_role from app.product_module_commercial c join app.modules m on m.id=c.module_id where m.code='marketing.voice-transcription'" | grep -q '^feature$'
          REMOTE
      - name: Verify local Marketing control channel
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          source /etc/imds-platform-control.env
          test -n "$IMDS_PLATFORM_CONTROL_TOKEN"
          cleanup() { rm -f /tmp/imds-platform-info.json /tmp/imds-platform-tenants.json; }
          trap cleanup EXIT
          curl -fsS --max-time 10 -H "Authorization: Bearer $IMDS_PLATFORM_CONTROL_TOKEN" http://127.0.0.1:8787/internal/platform/info -o /tmp/imds-platform-info.json
          curl -fsS --max-time 10 -H "Authorization: Bearer $IMDS_PLATFORM_CONTROL_TOKEN" http://127.0.0.1:8787/internal/platform/tenants -o /tmp/imds-platform-tenants.json
          python3 - <<'PY'
          import json
          with open('/tmp/imds-platform-info.json', encoding='utf-8') as stream: info=json.load(stream)
          with open('/tmp/imds-platform-tenants.json', encoding='utf-8') as stream: tenants=json.load(stream)
          if info.get('product') != 'imds-marketing': raise SystemExit(f"Unexpected product response: {info!r}")
          if not isinstance(tenants.get('items'), list): raise SystemExit(f"Unexpected tenants response: {tenants!r}")
          print(f"marketing_product={info['product']}")
          print(f"marketing_tenants={len(tenants['items'])}")
          PY
          test "$(systemctl is-active imdssa-reconcile.timer)" = active
          test "$(systemctl is-active imdssa-product-monitor.timer)" = active
          REMOTE
      - name: Verify public endpoint
        run: |
          curl -fsS --max-time 20 "http://$VPS_HOST:8080/healthz"
          curl -fsS --max-time 20 "http://$VPS_HOST:8080/" | grep -qi '<div id="root"'
      - name: Publish deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='IMDS Control Center VPS deploy failed'
          if [ "$JOB_STATUS" = success ]; then state=success; description='IMDS Control Center VPS deploy verified'; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"imdssa/vps-deploy\",\"description\":\"$description\"}"