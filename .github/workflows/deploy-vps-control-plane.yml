name: Deploy VPS Control Plane
on:
  push:
    branches: ['agent/vps-control-plane']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-vps-control-plane
  cancel-in-progress: true
env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: 'test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_PASSWORD"'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint --workspace @imds/vps-api
      - run: npm run build --workspace @imds/vps-api
      - name: Build real-only frontend
        env:
          VITE_RUNTIME: vps
          VITE_APP_ENV: production
          VITE_APP_VERSION: 0.6.0
          VITE_RELEASE_SHA: ${{ github.sha }}
          IMDS_STRICT_ENV: 'true'
        run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Stage release
        run: |
          mkdir -p .deploy-stage/web .deploy-stage/api/dist
          cp -a dist/. .deploy-stage/web/
          cp -a apps/vps-api/dist/. .deploy-stage/api/dist/
          cp apps/vps-api/package.json .deploy-stage/api/package.json
          cp deploy/vps/migrations/002_auth_sessions.sql .deploy-stage/002_auth_sessions.sql
          cp deploy/vps/migrations/003_platform_management.sql .deploy-stage/003_platform_management.sql
          cp deploy/vps/nginx-super-admin.conf .deploy-stage/nginx.conf
          cp deploy/vps/deploy-control-plane.sh .deploy-stage/deploy-control-plane.sh
          cp deploy/vps/product-monitor.sh .deploy-stage/product-monitor.sh
          cp deploy/vps/imdssa-product-monitor.service .deploy-stage/product-monitor.service
          cp deploy/vps/imdssa-product-monitor.timer .deploy-stage/product-monitor.timer
      - name: Upload and deploy
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/imdssa-release && mkdir -p /tmp/imdssa-release'
          sshpass -e scp "${SSH_ARGS[@]}" -r .deploy-stage/. "$VPS_USER@$VPS_HOST:/tmp/imdssa-release/"
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "sudo install -m 0750 /tmp/imdssa-release/deploy-control-plane.sh /opt/imds-super-admin/deploy-control-plane.sh && sudo /opt/imds-super-admin/deploy-control-plane.sh '${GITHUB_SHA}' /tmp/imdssa-release"
      - name: Verify public endpoint
        run: |
          curl -fsS --max-time 20 "http://$VPS_HOST:8080/healthz"
          curl -fsS --max-time 20 "http://$VPS_HOST:8080/" | grep -qi '<div id="root"'
