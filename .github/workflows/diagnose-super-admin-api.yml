name: Diagnose Super Admin API

on:
  push:
    branches: ['agent/vps-control-plane']
    paths: ['.github/workflows/diagnose-super-admin-api.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate VPS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Probe authenticated API routes
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          sshpass -e ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          API=http://127.0.0.1:8788
          TOKEN="$(openssl rand -hex 32)"
          TOKEN_HASH="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          ADMIN_ID="$(sudo -u postgres psql --dbname=imdssa --tuples-only --no-align --command="select id from app.platform_users where is_active=true and global_role in ('platform_owner','platform_admin') order by case global_role when 'platform_owner' then 0 else 1 end, created_at limit 1")"
          test -n "$ADMIN_ID"
          sudo -u postgres psql --dbname=imdssa --set=ON_ERROR_STOP=1 --command="insert into app.auth_sessions(user_id,token_hash,expires_at) values ('$ADMIN_ID'::uuid,'$TOKEN_HASH',now()+interval '10 minutes')" >/dev/null
          cleanup() {
            sudo -u postgres psql --dbname=imdssa --command="delete from app.auth_sessions where token_hash='$TOKEN_HASH'" >/dev/null 2>&1 || true
            rm -f /tmp/imdssa-api-probe-body
          }
          trap cleanup EXIT

          echo '=== deployed runtime ==='
          systemctl is-active imds-super-admin-api.service
          systemctl show imds-super-admin-api.service -p MainPID -p ActiveEnterTimestamp --no-pager
          grep -q 'control-commands' /opt/imds-super-admin/api/dist/index.js && echo 'DEPLOYED_CONTROL_COMMAND_ROUTE=yes' || echo 'DEPLOYED_CONTROL_COMMAND_ROUTE=no'

          echo '=== authenticated routes ==='
          routes=(
            /api/auth/me
            /api/v1/overview
            /api/v1/organizations
            /api/v1/products
            /api/v1/modules
            /api/v1/installations
            /api/v1/organization-products
            /api/v1/control-commands
            /api/v1/audit
          )
          failed=0
          for route in "${routes[@]}"; do
            code="$(curl -sS --max-time 15 -o /tmp/imdssa-api-probe-body -w '%{http_code}' -H "Cookie: imdssa_session=$TOKEN" "$API$route")"
            echo "$code $route"
            if [ "$code" != 200 ]; then
              printf 'BODY '
              head -c 500 /tmp/imdssa-api-probe-body || true
              printf '\n'
              failed=1
            fi
          done

          echo '=== nginx proxy routes ==='
          nginx -T 2>/dev/null | grep -nE 'listen 8080|location /api|location = /healthz|proxy_pass' | tail -40 || true
          exit "$failed"
          REMOTE
