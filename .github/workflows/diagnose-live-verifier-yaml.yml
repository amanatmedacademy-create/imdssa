name: Diagnose Live Verifier YAML

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event.issue.number == 47
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
      - name: Run actionlint and report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          output="$(./actionlint .github/workflows/scheduled-main-live-verification.yml 2>&1)"
          rc=$?
          if [ -z "$output" ]; then output='actionlint=clean'; fi
          gh issue comment 47 --repo "$REPO" --body "actionlint_result rc=$rc

\`\`\`
$output
\`\`\`"
          exit 0
