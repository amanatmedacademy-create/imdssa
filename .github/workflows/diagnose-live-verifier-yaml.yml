name: Diagnose Live Verifier YAML

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event.issue.number == 47
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Run actionlint and report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          output="$($(go env GOPATH)/bin/actionlint .github/workflows/scheduled-main-live-verification.yml 2>&1)"
          rc=$?
          if [ -z "$output" ]; then output='actionlint=clean'; fi
          gh issue comment 47 --repo "$REPO" --body "actionlint_result (rc=$rc):

\`\`\`
$output
\`\`\`"
