name: Apply RBAC Registration Reconcile

on:
  push:
    branches: ['agent/reconcile-rbac-registration-center']
    paths:
      - 'scripts/reconcile-rbac-registration.py'
      - '.github/workflows/apply-rbac-registration-reconcile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/reconcile-rbac-registration.py'
      - '.github/workflows/apply-rbac-registration-reconcile.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reconcile-rbac-registration-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reconciliation patch
        run: python3 scripts/reconcile-rbac-registration.py
      - name: Validate combined runtime
        run: |
          npm install --no-audit --no-fund
          npm run lint --workspace @imds/vps-api
          npm run build --workspace @imds/vps-api
          npm run lint
          VITE_RUNTIME=vps VITE_APP_ENV=production VITE_APP_VERSION=0.7.0 IMDS_STRICT_ENV=true npm run build
      - name: Commit generated reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IMDS Automation'
          git config user.email 'automation@imds.local'
          git add apps/vps-api/src/index.ts src/vps/VpsApp.tsx deploy/vps/deploy-control-plane.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'reconcile tenant RBAC with registration center'
            git pull --rebase origin agent/reconcile-rbac-registration-center
            git push origin HEAD:agent/reconcile-rbac-registration-center
          fi
