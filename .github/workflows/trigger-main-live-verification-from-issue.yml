name: Trigger Main Live Verification From Issue

on:
  issues:
    types: [edited]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  trigger:
    if: github.event.issue.number == 47
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one-shot verifier with diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          output="$(gh workflow run scheduled-main-live-verification.yml --repo "$REPO" --ref main 2>&1)"
          rc=$?
          gh issue comment 47 --repo "$REPO" --body "dispatch_result rc=$rc

\`\`\`
$output
\`\`\`"
          exit "$rc"
